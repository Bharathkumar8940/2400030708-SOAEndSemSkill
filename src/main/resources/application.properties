spring.application.name=account-service-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/accounts/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/accounts/?(?<remaining>.*), /internal/accounts/$\{remaining}